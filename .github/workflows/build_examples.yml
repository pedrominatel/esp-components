name: 'Build Component Examples'

on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '0 1 * * 6'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    container: espressif/idf:${{ matrix.idf_ver }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Baseline ESP-IDF 4.4 components (ESP32)
            idf_ver: release-v4.4
            idf_target: esp32
            paths: grove_lcd max17043 tmc2208
          - name: Baseline ESP-IDF 5.0 components (ESP32)
            idf_ver: release-v5.0
            idf_target: esp32
            paths: mc3479
          - name: Baseline ESP-IDF 5.2 components (ESP32)
            idf_ver: release-v5.2
            idf_target: esp32
            paths: lc709203
          - name: Baseline ESP-IDF 5.3 components (ESP32)
            idf_ver: release-v5.3
            idf_target: esp32
            paths: ddp hp203b lis3dh nt3h2111 sgp30 sht4x shtc3 st25dv t9602
          - name: Baseline ESP-IDF 5.5 TV-B-Gone (ESP32-C3)
            idf_ver: release-v5.5
            idf_target: esp32c3
            paths: tv-b-gone
          - name: Baseline and latest ESP-IDF 6.1 Ultraled (ESP32-P4)
            idf_ver: release-v6.1
            idf_target: esp32p4
            paths: ultraled
          - name: Latest ESP-IDF 6.1 general components (ESP32)
            idf_ver: release-v6.1
            idf_target: esp32
            paths: ddp grove_lcd hp203b lc709203 lis3dh max17043 mc3479 nt3h2111 sgp30 sht4x shtc3 st25dv t9602 tmc2208
          - name: Latest ESP-IDF 6.1 TV-B-Gone (ESP32-C3)
            idf_ver: release-v6.1
            idf_target: esp32c3
            paths: tv-b-gone
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install idf-build-apps
      shell: bash
      run: |
        . ${IDF_PATH}/export.sh
        python3 -m pip install idf-build-apps==2.4.3

    - name: Build component applications
      shell: bash
      run: |
        . ${IDF_PATH}/export.sh
        idf-build-apps build \
          --paths ${{ matrix.paths }} \
          --target ${{ matrix.idf_target }} \
          --recursive \
          --build-dir build_${{ matrix.idf_target }}
